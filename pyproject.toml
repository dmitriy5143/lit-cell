[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lit-cell-forecasting"
version = "0.2.0"
description = "Local Innovation Transport for causal streaming cell-motion forecasting"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [
  {name = "Dmitry Stanislavchuk-Abovsky"},
  {name = "Andrey P. Zakharov"},
]
dependencies = [
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "scipy>=1.17,<2",
  "torch>=2.8,<3",
  "torch-geometric>=2.7,<3",
]

[project.urls]
Repository = "https://github.com/dmitriy5143/lit-cell"
Documentation = "https://github.com/dmitriy5143/lit-cell/blob/main/REPRODUCIBILITY.md"

[tool.setuptools.packages.find]
where = ["src"]
include = ["lit_cell_forecasting*"]
